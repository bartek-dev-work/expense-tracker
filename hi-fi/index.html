<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wydatki — Hi-fi prototyp</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
        colors: {
          ink:    { 900: '#0F172A', 500: '#64748B' },
          line:   { DEFAULT: '#E2E8F0', dark: '#1F2937' },
          surface:{ DEFAULT: '#FFFFFF', dark: '#111827' },
          bg:     { DEFAULT: '#FAFAFA', dark: '#0B1120' },
          brand:  { 500: '#6366F1', 600: '#4F46E5', 400: '#818CF8' },
          ok:     '#10B981',
          danger: '#EF4444',
          warn:   '#F59E0B',
          cat:    {
            food:  '#F97316',
            transport: '#06B6D4',
            bills: '#8B5CF6',
            fun:   '#EC4899',
            other: '#64748B',
          },
        },
        boxShadow: {
          card: '0 1px 2px rgba(15,23,42,0.04), 0 1px 3px rgba(15,23,42,0.06)',
          pop:  '0 20px 40px -12px rgba(15,23,42,0.18), 0 8px 16px -8px rgba(15,23,42,0.10)',
          fab:  '0 12px 28px -8px rgba(99,102,241,0.55), 0 4px 12px -4px rgba(99,102,241,0.45)',
        },
      },
    },
  };
</script>

<style>
  html, body { height: 100%; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #F1F5F9;
    color: #0F172A;
    -webkit-font-smoothing: antialiased;
  }
  .dark body { background: #0B1120; color: #F8FAFC; }

  .num { font-variant-numeric: tabular-nums; }

  /* Caption */
  .caption { font-size: 12px; font-weight: 500; letter-spacing: 0.05em; text-transform: uppercase; }

  /* Color transitions for theme toggle */
  .theme-transition, .theme-transition * {
    transition: background-color 200ms ease, border-color 200ms ease, color 200ms ease, fill 200ms ease, stroke 200ms ease;
  }

  /* Custom scrollbar inside frames */
  .frame-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
  .frame-scroll::-webkit-scrollbar-thumb { background: rgba(100,116,139,0.4); border-radius: 999px; }
  .frame-scroll::-webkit-scrollbar-track { background: transparent; }

  /* Toast slide-up */
  @keyframes toast-in {
    0%   { transform: translate(-50%, 30px); opacity: 0; }
    100% { transform: translate(-50%, 0);    opacity: 1; }
  }
  @keyframes toast-out {
    0%   { transform: translate(-50%, 0);    opacity: 1; }
    100% { transform: translate(-50%, 30px); opacity: 0; }
  }
  .toast-in  { animation: toast-in  220ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
  .toast-out { animation: toast-out 180ms cubic-bezier(0.4, 0, 0.6, 1) both; }

  /* Modal */
  @keyframes modal-in {
    0%   { transform: scale(0.96); opacity: 0; }
    100% { transform: scale(1);    opacity: 1; }
  }
  @keyframes backdrop-in { 0% { opacity: 0; } 100% { opacity: 1; } }
  .backdrop-in { animation: backdrop-in 160ms ease-out both; }
  .modal-in    { animation: modal-in    180ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  /* Bottom sheet */
  @keyframes sheet-in {
    0%   { transform: translateY(100%); }
    100% { transform: translateY(0);    }
  }
  .sheet-in { animation: sheet-in 220ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }

  /* Bar grow (for our SVG bars; recharts handles its own) */
  @keyframes barGrow { from { transform: scaleY(0); } to { transform: scaleY(1); } }

  /* Progress bar fill animation */
  @keyframes progressFill {
    from { width: 0%; }
  }

  /* Skeleton pulse — reuse animate-pulse from Tailwind. Keep this for non-tailwind contexts. */
  @keyframes skeletonPulse { 0%,100%{opacity:.5} 50%{opacity:.85} }

  /* Focus ring helper */
  .focus-ring:focus-visible { outline: none; box-shadow: 0 0 0 2px #FFFFFF, 0 0 0 4px #6366F1; }
  .dark .focus-ring:focus-visible { box-shadow: 0 0 0 2px #0B1120, 0 0 0 4px #818CF8; }

  /* Hide spinner on number inputs */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type=number] { -moz-appearance: textfield; }
</style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <!-- Recharts (UMD) — needs prop-types -->
  <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js" crossorigin="anonymous"></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- App -->
  <script type="text/babel" data-presets="env,react" src="data.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="components.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="shells.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="dashboard.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="list.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="add.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="stats.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="settings.jsx"></script>
  <script type="text/babel" data-presets="env,react" src="app.jsx"></script>
</body>
</html>
